    image: logo-small.png
    description: >
      We offer a range of first aid courses, from basic to advanced, to ensure
      you are prepared for any situation. Our courses are designed to be
      practical and engaging, providing you with the skills and confidence to
      respond effectively in emergencies.
    available: true
