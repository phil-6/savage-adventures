<header class="container-fluid">
  <div class="row logo-row">
    <div class="col">
      <div class="social-links d-flex align-items-center justify-content-center">
        <a class="social-link social-tripadvisor"
           href="https://www.tripadvisor.co.uk/Attraction_Review-g186463-d12964875-Reviews-Savage_Adventures-Newport_South_Wales_Wales.html"
           target="_blank" rel="noopener noreferrer" aria-label="Visit us on TripAdvisor">
          <i class="fab fa-2x fa-tripadvisor" aria-hidden="true"></i>
        </a>
        <a class="social-link social-facebook" href="https://www.facebook.com/Savage.Adventures"
           target="_blank" rel="noopener noreferrer" aria-label="Visit us on Facebook">
          <i class="fab fa-2x fa-facebook" aria-hidden="true"></i>
        </a>
        <a class="social-link social-x" href="https://x.com/sav_adventures"
           target="_blank" rel="noopener noreferrer" aria-label="Visit us on X">
          <i class="fab fa-2x fa-twitter" aria-hidden="true"></i>
        </a>
        <a class="social-link social-instagram" href="https://www.instagram.com/savage.adventures/"
           target="_blank" rel="noopener noreferrer" aria-label="Visit us on Instagram">
          <i class="fab fa-2x fa-instagram" aria-hidden="true"></i>
        </a>
        <a class="social-link social-youtube" href="https://www.youtube.com/channel/UC23cqj-gvRmK4-nGjWLRo6w"
           target="_blank" rel="noopener noreferrer" aria-label="Visit us on YouTube">
          <i class="fab fa-2x fa-youtube" aria-hidden="true"></i>
        </a>
        <button class="social-link d-flex align-items-center" id="theme-toggle" aria-label="Toggle colour theme">
          <i class="fas fa-2x fa-moon dark" aria-hidden="true"></i>
          <i class="fas fa-2x fa-sun light" aria-hidden="true"></i>
          <i class="fas fa-2x fa-palette multi" aria-hidden="true"></i>
          <span id="theme-label"></span>
        </button>
      </div>
    </div>
    <div class="col">
      <div class="site-logo-container d-flex align-items-center justify-content-center">
        <a href="/">
          <img class="site-logo"
               src="/assets/images/logo-large.png" alt="Savage Adventures home">
        </a>
      </div>
    </div>
    <div class="col contact-links-col">
      <div class="text-center contact-links">
        <a href="mailto:{{ site.customer_email }}">
          <i class="fas fa-envelope" aria-hidden="true"></i>
          {{ site.customer_email }}
        </a>
      </div>
    </div>
  </div>

  <!--Tagline and Navbar-->
  <div class="row">
    <div class="col">
      <h1 class="text-center display-heading">
        {{ page.tagline }}
      </h1>
    </div>
  </div>
  <nav class="navbar navbar-expand-md justify-content-center">
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#mainNav" aria-controls="mainNav"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-center" id="mainNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link{% if page.url == '/about-us.html' %} active" aria-current="page{% endif %}" href="/about-us">About Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link{% if page.url contains '/adventures' %} active" aria-current="page{% endif %}" href="/adventures">Adventures</a>
        </li>
        <li class="nav-item">
          <a class="nav-link{% if page.url == '/stag-hen.html' %} active" aria-current="page{% endif %}" href="/stag-hen">Stag & Hen</a>
        </li>
        <li class="nav-item dropdown">
          <button class="nav-link btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
            More
          </button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item nav-link" href="/training">First Aid</a></li>
            <li><a class="dropdown-item nav-link" href="/education">Education Groups</a></li>
            <li><a class="dropdown-item nav-link" href="/corporate">Corporate</a></li>
            <li><a class="dropdown-item nav-link" href="/challenges">Challenges</a></li>
            <li><a class="dropdown-item nav-link" href="/john-muir">John Muir Award</a></li>
          </ul>
        </li>
        <li class="nav-item">
          <a class="nav-link{% if page.url == '/contact-us.html' %} active" aria-current="page{% endif %}" href="/contact-us">Contact Us</a>
        </li>
      </ul>
    </div>
  </nav>
</header>
