<div class="form-elements">
  <div class="row">
    <div class="col name">
      <label for="{{ include.form_id }}-name" class="visually-hidden">Name</label>
      <input type="text" id="{{ include.form_id }}-name" name="name" class="form-control"
             placeholder="Name *" required>
    </div>
    <div class="col email">
      <label for="{{ include.form_id }}-email" class="visually-hidden">Email</label>
      <input type="email" id="{{ include.form_id }}-email" name="email" class="form-control"
             placeholder="Email *" required>
    </div>
  </div>
  <div class="row">
    <div class="col">
      <label for="{{ include.form_id }}-phone" class="visually-hidden">Phone number</label>
      <input type="tel" id="{{ include.form_id }}-phone" name="phone" class="form-control"
             placeholder="Phone number">
    </div>
  </div>
  <div class="row">
    <div class="col">
      <label for="{{ include.form_id }}-subject" class="visually-hidden">Subject</label>
      <input type="text" id="{{ include.form_id }}-subject" name="subject" class="form-control"
             placeholder="Subject" required>
    </div>
  </div>
  <div class="row">
    <div class="col">
      <label for="{{ include.form_id }}-message" class="visually-hidden">Message</label>
      <textarea id="{{ include.form_id }}-message" name="message" class="form-control"
                placeholder="Message" required></textarea>
    </div>
  </div>
  <input type="hidden" name="honeypot">
  <div class="d-flex justify-content-center">
    {% include contact/cf-turnstile.html %}
  </div>
  <div class="row justify-content-center">
    <button type="submit" class="btn btn-primary submit-button w-auto" disabled>
      <em>Send</em>
    </button>
  </div>
</div>
<div class="row">
  <div class="form-spinner col text-center d-none">
    <h3>Please hold while we send your message</h3>
    <i class="fa-solid fa-spinner fa-spin fa-4x" aria-hidden="true"></i>
  </div>
</div>
