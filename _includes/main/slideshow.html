<!--Main Slideshow-->
<div id="mainCarousel" class="carousel slide py-4" data-bs-ride="true" data-bs-interval="5000" aria-label="Adventure photo slideshow">
  <div class="carousel-indicators">
    {% for image in header_images %}
    <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="{{ forloop.index0 }}"
            {% if forloop.first %}class="active" aria-current="true"{% endif %}
            aria-label="Slide {{ forloop.index }}"></button>
    {% endfor %}
  </div>
  <div class="carousel-inner">
    {% for image in header_images %}
    <div class="carousel-item {% if forloop.first %}active{% endif %}">
      {% assign alt_text = site.data.header_images[image.basename] %}
      <img class="d-block w-100" src="{{ image.path }}" alt="{{ alt_text | default: image.basename }}">
    </div>
    {% endfor %}
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
