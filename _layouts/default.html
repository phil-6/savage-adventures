<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="Phil Reynolds">
  <meta name="theme-color" content="#ff3300">
  <link rel="icon" type="image/png" href="/assets/favicon/favicon.png" sizes="16x16"/>
  <link rel="icon" type="image/png" href="/assets/favicon/favicon.png" sizes="32x32"/>
  <link rel="icon" type="image/png" href="/assets/favicon/favicon.png" sizes="96x96"/>

  <title>{{ page.title }} | Savage Adventures</title>
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{{ page.title }} | Savage Adventures">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}/assets/images/{{ page.og_image | default: 'logo-large.png' }}">
  <meta property="og:site_name" content="Savage Adventures">
  <meta property="og:locale" content="en_GB">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@{{ site.twitter_username }}">
  <meta name="twitter:title" content="{{ page.title }} | Savage Adventures">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image" content="{{ site.url }}/assets/images/{{ page.og_image | default: 'logo-large.png' }}">

  <!-- Font preload -->
  <link rel="preload" href="/assets/fonts/zing-rust-grunge2-base.otf" as="font" type="font/otf" crossorigin>

  <!--  Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
        crossorigin="anonymous">

  <!-- Bootstrap JS (deferred) -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
          integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
          crossorigin="anonymous" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
          integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
          crossorigin="anonymous" defer></script>

  <!-- Cloudflare Turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <!-- Font Awesome (deferred) -->
  <script src="https://kit.fontawesome.com/30fa2950fc.js" crossorigin="anonymous" defer></script>

  <!-- Font Family -->
  <link href="https://fonts.googleapis.com/css?family=Permanent+Marker|Raleway:100,300,400,900&display=swap" rel="stylesheet">

  <!-- StyleSheet -->
  <link rel="stylesheet"
        type="text/css"
        href="/assets/css/sav-main.css"/>
  <link rel="stylesheet"
        type="text/css"
        href="/assets/css/sav-themes.css"/>

  {% include structured-data.html %}
</head>
<body class="{{ page.bodyclass }}">
<script>
  (function() {
    var theme = null;
    try { theme = localStorage.getItem('theme'); } catch(e) {}
    if (!theme) {
      theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' :
              window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'multi';
    }
    document.body.classList.add(theme + '-mode');
    document.body.dataset.bsTheme = (theme === 'light') ? 'light' : 'dark';
  })();
</script>
{% include header.html %}
{{ content }}
{% include footer.html %}
{% include contact/book-now-modal.html %}
{% include contact/more-info-modal.html %}
<script data-cfasync="false" type="text/javascript" src="/assets/js/form-submission-handler.js"></script>
<!-- Theme Toggle -->
<script src="/assets/js/themeToggle.js"></script>
</body>
</html>
